# Run only when the commit explicitly requests a build or release.
# [build] checks that the project builds; [release] also bumps the version.

name: build
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    if: >
      (github.event_name == 'push'
      && (contains(github.event.head_commit.message, '[build]')
      || contains(github.event.head_commit.message, '[release]')))
      || (github.event_name == 'pull_request'
      && (contains(github.event.pull_request.title, '[build]')
      || contains(github.event.pull_request.title, '[release]')))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar

  bump-version:
    if: >
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.actor != 'github-actions[bot]'
      && contains(github.event.head_commit.message, '[release]')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: bump gradle.properties version
        id: bump
        run: |
          set -euo pipefail
          current="$(grep -E '^version=' gradle.properties | cut -d= -f2- | tr -d '\r')"
          if [[ ! "$current" =~ ^([0-9.]+)-([0-9]+)\.([0-9]+)$ ]]; then
            echo "Unexpected version format: $current (expected like 26.2-1.3)"
            exit 1
          fi
          mc="${BASH_REMATCH[1]}"
          major="${BASH_REMATCH[2]}"
          minor="${BASH_REMATCH[3]}"
          next="${mc}-${major}.$((minor + 1))"
          sed -i "s/^version=${current}/version=${next}/" gradle.properties
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "Bumped version ${current} -> ${next}"
      - name: commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          if git diff --staged --quiet; then
            echo "No version change to commit"
            exit 0
          fi
          git commit -m "chore: bump version to ${{ steps.bump.outputs.next }}"
          git push
