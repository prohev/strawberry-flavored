name: Feature request
description: Suggest a new feature, recipe, or quality-of-life improvement
title: ""
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Strawberry Flavored? Let us know what you want to see added or improved.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: Describe the problem or frustration this would address.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What would you like the mod to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are there other ways to solve this problem that you have tried or considered?

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add mockups, examples, screenshots, or any other relevant information.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked whether this idea is already covered by an existing issue or discussion.
          required: true
