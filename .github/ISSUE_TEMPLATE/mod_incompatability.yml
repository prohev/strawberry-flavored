name: Mod incompatibility
description: Report a compatibility issue between Strawberry Flavored and another mod
title: ""
labels: ["mod incompatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a compatibility problem. Please include the versions and details below so we can investigate.

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      description: The version of Minecraft you are running.
      placeholder: 1.20.1
    validations:
      required: true

  - type: input
    id: strawberry-version
    attributes:
      label: Strawberry Flavored version
      description: The version of Strawberry Flavored installed.
    validations:
      required: true

  - type: input
    id: other-mods
    attributes:
      label: Other mod(s)
      description: List the mod or mods involved in the incompatibility.
      placeholder: Fabric API, Sodium, etc.
    validations:
      required: true

  - type: input
    id: loader
    attributes:
      label: Mod loader
      description: Fabric, Quilt, Forge, NeoForge, etc.
      placeholder: Fabric
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where does the incompatibility happen?
      options:
        - Singleplayer
        - Multiplayer
        - Dedicated server
    validations:
      required: true

  - type: textarea
    id: what-happens
    attributes:
      label: What happens?
      description: Describe the bug, crash, or unexpected behavior.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: mod-list
    attributes:
      label: Full mod list
      description: Include your full mod list or a relevant subset, if possible.
      placeholder: |
        Fabric API
        Sodium
        etc.

  - type: textarea
    id: logs
    attributes:
      label: Logs / crash report
      description: Paste the relevant logs or crash report here.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for an existing issue related to this mod incompatibility.
          required: true
        - label: I have attached logs, screenshots, or a crash report if available.
          required: false
