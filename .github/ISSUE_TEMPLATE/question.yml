name: Question
description: Ask a question about gameplay, mechanics, configuration, or mod usage
title: ""
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Ask your question here. Please include enough context so we can help you.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What would you like to know?
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      description: The version of Minecraft you are using.
      placeholder: 1.20.1

  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: The version of Strawberry Flavored you are using.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Add any relevant details, steps you've tried, or screenshots.

  - type: textarea
    id: attempted-solutions
    attributes:
      label: What have you tried?
      description: Mention any troubleshooting steps or configuration changes you already attempted.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked the README and searched for an existing issue.
          required: false
